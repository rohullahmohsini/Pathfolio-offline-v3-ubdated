name: Signed Pathfolio Release

on:
  workflow_dispatch:

jobs:
  build-signed-release:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP project file was found."
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          rm -rf extracted-project
          mkdir extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project
          test -f extracted-project/settings.gradle || test -f extracted-project/settings.gradle.kts

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "SIGNING_STORE_PASSWORD is missing"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "SIGNING_KEY_ALIAS is missing"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "SIGNING_KEY_PASSWORD is missing"; exit 1; }

      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/pathfolio-release.jks"
          test -s "$RUNNER_TEMP/pathfolio-release.jks"

      - name: Build signed APK and AAB
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/pathfolio-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle -p extracted-project :app:assembleRelease :app:bundleRelease --stacktrace --console=plain

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: Pathfolio-3.1.0-signed-release
          path: |
            extracted-project/app/build/outputs/apk/release/*.apk
            extracted-project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Delete temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pathfolio-release.jks"
